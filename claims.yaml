- id: chain-def
  kind: definition
  rationale: Defines the accountability chain as a product of six stage probabilities.
  passage: The probability that an act of type $m$ ends in a consequence is the product of the stage pass
    probabilities,
- id: stage-groups
  kind: assumption
  rationale: 'Modelling assumption: AI lifts only the evidence stages; the institutional stages are human
    and capturable and unchanged by alpha.'
  passage: No model performs them.
- id: illustrative
  kind: assumption
  rationale: Stage means, costs, floor and budget are stipulated; the results are properties of the stipulated
    chain.
  passage: All magnitudes are illustrative.
- id: conservation
  kind: interpretation
  rationale: 'Follows from the bound values: with capture the post-AI consequence (0.007) ends at or below
    the pre-AI level (0.010).'
  passage: 'Impunity is conserved: the evidence gain occurs and the probability of consequence ends where
    it began.'
- id: weakest-link
  kind: interpretation
  rationale: 'Structural argument from the product form: gains at uncontrolled links are absorbed at a
    controllable link.'
  passage: The conservation follows from the structure of the chain.
- id: thirteenfold
  kind: interpretation
  rationale: '''Nearly thirteenfold'' states the bound multiple 12.8 (results.json /conservation/post_ai_no_capture_multiple_of_pre
    = 12.84).'
  passage: Cheaper evidence alone would raise the mean probability of consequence nearly thirteenfold,
    from 0.010 to 0.123, but an elite that spends a fixed budget capturing prosecution and judgment returns
    it to 0.007, slightly below the pre-AI level.
- id: fifteenfold
  kind: interpretation
  rationale: '''About fifteenfold'' states the bound multiple 14.6 (results.json /exposure_gap/gap_multiple).'
  passage: The gap between exposure and consequence widens about fifteenfold, from 0.068 to 0.993.
- id: strong-thesis-false
  kind: interpretation
  rationale: The model does not bear on motives; the rejection of the anticipatory-counterrevolution thesis
    rests on chronology and the cited evidence on status threat.
  passage: The results do not support the strong thesis.
- id: institutional-remedy
  kind: normative
  rationale: Normative conclusion from the bottleneck result.
  passage: 'The remaining work is institutional: independent prosecutors, courts insulated from capture
    and enforcement that binds the strong.'

- id: mutz-status
  kind: source
  evidence:
    citation_id: mutz2018
    locator: Significance statement
    verified: true
    verification_note: 'DOI 10.1073/pnas.1718155115; Crossref significance statement: change in financial
      wellbeing had little impact on 2016 candidate preference; changing preferences tracked issues threatening
      dominant-group status.'
  passage: 'The movements the thesis names were largely formed before generative AI reached its present
    capabilities, and their support is well explained by other forces: status threat, in the most carefully
    studied case, outweighs personal economic hardship [@mutz2018], alongside nationalism, religious mobilization,
    demographic anxiety, the collapse of local media and the ordinary preference of those in power for
    fewer constraints.'

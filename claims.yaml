      countries organized and analyzed the FinCEN Files.'
  passage: 'The offshore leaks and cross-border investigations demonstrate the capability: the FinCEN
    Files joined reporters in 88 countries, and leaked customer lists of offshore institutions, matched
    to administrative wealth records, show that the richest 0.01 percent of households evade about a quarter
    of their taxes [@alstadsaeter2019; @icij2024].'
